<!DOCTYPE html>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Noto+Sans+TC:wght@500;700;900&display=swap');

    body {
      font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    
    .font-digital {
      font-family: 'Chakra Petch', 'Noto Sans TC', monospace;
    }

    /* 極致大字適應視窗 */
    .huge-time {
      font-size: clamp(5.5rem, 18vw, 15rem);
      line-height: 0.95;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes subtle-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.02); opacity: 0.92; }

    .animate-subtle {
      animation: subtle-pulse 3s infinite ease-in-out;

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-700 ease-in-out">

    <!-- 超大純圖示觸控按鈕群組（附懸停 Tooltip） -->

      </div>

      <!-- 行程編修按鈕 -->
      <div class="relative group">
        <button onclick="toggleScheduleModal(true)" aria-label="行程時間與內容編修" class="w-12 h-12 md:w-14 md:h-14 flex items-center justify-center rounded-2xl bg-indigo-900/70 hover:bg-indigo-800 text-indigo-200 border-2 border-indigo-500/50 text-2xl md:text-3xl shadow-xl transition active:scale-95">

        </div>
      </div>

      <!-- 全螢幕按鈕 -->
      <div class="relative group">
        <button onclick="toggleFullScreen()" id="fsBtn" aria-label="全螢幕切換" class="w-12 h-12 md:w-14 md:h-14 flex items-center justify-center rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white text-2xl md:text-3xl shadow-xl shadow-emerald-950/60 transition active:scale-95 border-2 border-emerald-400">
          <span id="fsIcon">⛶</span>
        </button>
        <div class="absolute -bottom-10 left-1/2 -translate-x-1/2 px-3 py-1.5 bg-slate-800 text-emerald-300 text-xs md:text-sm font-bold rounded-xl opacity-0 pointer-events-none group-hover:opacity-100 transition duration-200 whitespace-nowrap border border-slate-600 shadow-xl z-30">
          全螢幕切換
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2 flex-wrap">
      <button onclick="switchWeekday(1)" id="btnDay-1" class="weekday-btn px-4 md:px-6 py-2 md:py-2.5 rounded-xl font-black text-sm md:text-lg transition-all border-2">週一</button>
      <button onclick="switchWeekday(2)" id="btnDay-2" class="weekday-btn px-4 md:px-6 py-2 md:py-2.5 rounded-xl font-black text-sm md:text-lg transition-all border-2">週二 (含氟漱口水)</button>
      <button onclick="switchWeekday(3)" id="btnDay-3" class="weekday-btn px-4 md:px-6 py-2 md:py-2.5 rounded-xl font-black text-sm md:text-lg transition-all border-2">週三 (12:40放學)</button>
      <button onclick="switchWeekday(4)" id="btnDay-4" class="weekday-btn px-4 md:px-6 py-2 md:py-2.5 rounded-xl font-black text-sm md:text-lg transition-all border-2">週四</button>
      <button onclick="switchWeekday(5)" id="btnDay-5" class="weekday-btn px-4 md:px-6 py-2 md:py-2.5 rounded-xl font-black text-sm md:text-lg transition-all border-2">週五</button>

  </div>

          </div>
        </div>

    // 工具函數：時間字串轉分鐘數
    function timeToMinutes(tStr) {
      if (!tStr) return 0;
      const parts = tStr.split(':').map(Number);
      return parts[0] * 60 + (parts[1] || 0);
    }

    /* =================================================================
       Web Audio API 柔和純淨提示音
       ================================================================= */
    function initAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playChime(isAlert = true) {
      if (!soundEnabled) return;
      initAudioContext();
      if (!audioCtx) return;

      try {
        const now = audioCtx.currentTime;
        const notes = isAlert ? [523.25, 659.25, 783.99, 1046.50] : [440, 554.37, 659.25];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0.001, now + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.18, now + idx * 0.12 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.12 + 0.9);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 1.0);
        });
      } catch (e) {
        console.warn("音訊播放被瀏覽器限制", e);
      }
    }

    function toggleSound() {
      initAudioContext();
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('soundIcon');
      const btn = document.getElementById('soundBtn');
      if (soundEnabled) {
        icon.textContent = "🔔";
        btn.classList.replace('text-slate-500', 'text-slate-200');
        playChime(false);
      } else {
        icon.textContent = "🔕";
        btn.classList.replace('text-slate-200', 'text-slate-500');
      }
    }

    /* =================================================================

       ================================================================= */
    function toggleFullScreen() {
      initAudioContext();
      const fsIcon = document.getElementById('fsIcon');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const docElm = document.documentElement;
        if (docElm.requestFullscreen) {
          docElm.requestFullscreen();
        } else if (docElm.webkitRequestFullscreen) {
          docElm.webkitRequestFullscreen();
        }
        if (fsIcon) fsIcon.textContent = "🗗";
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        if (fsIcon) fsIcon.textContent = "⛶";
      }
    }

      initAudioContext();
      currentWeekday = day;
      lastAlertKey = null; // 重置警示以便當前時段重新判定

      // 更新按鈕外觀樣式

        if (d === day) {

        }
      }

      updateRhythm();
    }

    /* =================================================================
       核心節奏計算與畫面渲染
       ================================================================= */
    function updateRhythm() {
      const now = new Date();
      const currentHour = now.getHours();
      const currentMinute = now.getMinutes();
      const currentTotalMinutes = currentHour * 60 + currentMinute;

      const formattedHour = String(currentHour).padStart(2, '0');
      const formattedMinute = String(currentMinute).padStart(2, '0');
      const timeKey = `${formattedHour}:${formattedMinute}`;

      // 更新時鐘文字 (HH:MM)
      const clockEl = document.getElementById('clockDisplay');
      if (clockEl) clockEl.textContent = timeKey;

      const schedule = weeklySchedules[currentWeekday] || weeklySchedules[1];
      let currentPhase = null;
      let currentIndex = -1;

      // 檢查當前符合之時段
      for (let i = 0; i < schedule.length; i++) {
        const pStart = timeToMinutes(schedule[i].start);
        const pEnd = timeToMinutes(schedule[i].end);
        if (currentTotalMinutes >= pStart && currentTotalMinutes < pEnd) {
          currentPhase = schedule[i];
          currentIndex = i;
          break;
        }
      }

      const phaseTag = document.getElementById('phaseTag');
      const phaseIcon = document.getElementById('phaseIcon');
      const phaseTitle = document.getElementById('phaseTitle');
      const phaseSubtext = document.getElementById('phaseSubtext');
      const countdownText = document.getElementById('countdownText');
      const nextPhaseName = document.getElementById('nextPhaseName');
      const progressBar = document.getElementById('progressBar');
      const ambientGlow = document.getElementById('ambientGlow');

      // 非排程時段判定 (12:00 前 或 放學/午休後)
      if (!currentPhase) {
        const firstStart = schedule.length > 0 ? timeToMinutes(schedule[0].start) : 12 * 60;
        const lastEnd = schedule.length > 0 ? timeToMinutes(schedule[schedule.length - 1].end) : 13 * 60 + 20;

        if (currentTotalMinutes < firstStart) {
          const diff = firstStart - currentTotalMinutes;
          phaseTag.className = "px-6 md:px-10 py-2.5 md:py-3.5 rounded-full text-xl md:text-3xl font-black uppercase shadow-2xl transition-all duration-500 flex items-center gap-3 bg-slate-800 text-slate-300 border-2 border-slate-600";
          phaseIcon.textContent = "⏰";
          phaseTitle.textContent = "準備午餐時間";
          phaseSubtext.textContent = `距離午餐開始還有 ${diff} 分鐘`;
          countdownText.textContent = `${diff} 分鐘`;
          nextPhaseName.textContent = schedule.length > 0 ? schedule[0].title : "--";
          progressBar.style.width = "0%";
          ambientGlow.style.backgroundColor = "rgba(16, 185, 129, 0.05)";
        } else {
          phaseTag.className = "px-6 md:px-10 py-2.5 md:py-3.5 rounded-full text-xl md:text-3xl font-black uppercase shadow-2xl transition-all duration-500 flex items-center gap-3 bg-slate-800 text-slate-400 border-2 border-slate-700";
          phaseIcon.textContent = "✨";
          phaseTitle.textContent = "午休結束";
          phaseSubtext.textContent = currentWeekday === 3 ? "放學回家、注意交通安全" : "午休結束、精神飽滿迎接下午課程";
          countdownText.textContent = "已結束";
          nextPhaseName.textContent = "下午課堂";
          progressBar.style.width = "100%";
          ambientGlow.style.backgroundColor = "rgba(99, 102, 241, 0.08)";
        }

        checkSpecialAlerts(timeKey);
        return;
      }

      // 正常排程時段渲染
      phaseTag.className = `px-6 md:px-10 py-2.5 md:py-3.5 rounded-full text-xl md:text-3xl lg:text-4xl font-black uppercase shadow-2xl transition-all duration-500 flex items-center gap-3 border-2 md:border-4 ${currentPhase.colorClass || 'bg-emerald-600 text-white border-emerald-400'}`;
      phaseIcon.textContent = currentPhase.icon || "⏳";
      phaseTitle.textContent = currentPhase.title;
      phaseSubtext.textContent = currentPhase.subtext;

      const pStart = timeToMinutes(currentPhase.start);
      const pEnd = timeToMinutes(currentPhase.end);
      const minutesLeft = pEnd - currentTotalMinutes;
      const totalDuration = pEnd - pStart;
      const elapsed = currentTotalMinutes - pStart;
      const percent = totalDuration > 0 ? Math.min(100, Math.max(0, (elapsed / totalDuration) * 100)) : 100;

      countdownText.textContent = `${minutesLeft} 分鐘`;
      progressBar.style.width = `${percent}%`;
      progressBar.className = `h-full bg-gradient-to-r ${currentPhase.barColor || 'from-emerald-500 to-teal-400'} rounded-full transition-all duration-500 ease-out`;
      ambientGlow.style.backgroundColor = currentPhase.glowColor || 'rgba(16, 185, 129, 0.2)';

      if (currentIndex < schedule.length - 1) {
        nextPhaseName.textContent = schedule[currentIndex + 1].title;
      } else {
        nextPhaseName.textContent = currentWeekday === 3 ? "放學時間" : "下午課程";
      }

      checkSpecialAlerts(timeKey);
    }

    function updatePhaseField(idx, field, value) {
      if (weeklySchedules[currentWeekday] && weeklySchedules[currentWeekday][idx]) {
        weeklySchedules[currentWeekday][idx][field] = value;
      }
    }

    function addSchedulePhase() {
      if (!weeklySchedules[currentWeekday]) weeklySchedules[currentWeekday] = [];
      const currentList = weeklySchedules[currentWeekday];
      let newStart = "12:00";
      if (currentList.length > 0) {
        newStart = currentList[currentList.length - 1].end;
      }
      currentList.push({
        start: newStart,
        end: "12:50",
        title: "新時段項目",
        icon: "⏱️",
        subtext: "請自訂動作說明",

        glowColor: "rgba(99, 102, 241, 0.2)"

      renderScheduleInputs();

    function removeSchedulePhase(idx) {
      if (weeklySchedules[currentWeekday]) {
        weeklySchedules[currentWeekday].splice(idx, 1);
        renderScheduleInputs();
      }

      if (currentWeekday === 2) {
        weeklySchedules[2] = JSON.parse(JSON.stringify(DEFAULT_TUESDAY_SCHEDULE));
      } else if (currentWeekday === 3) {
        weeklySchedules[3] = JSON.parse(JSON.stringify(DEFAULT_WEDNESDAY_SCHEDULE));
      } else {
        weeklySchedules[currentWeekday] = JSON.parse(JSON.stringify(DEFAULT_GENERAL_SCHEDULE));
      }
      renderScheduleInputs();
    }

      toggleScheduleModal(false);
      lastAlertKey = null;

    document.addEventListener('keydown', (e) => {

        toggleScheduleModal(false);
        toggleDutyModal(false);
        dismissBroadcast();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      // 一次性點擊喚醒 AudioContext
      const unlockAudio = () => {
        initAudioContext();
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
      };
      window.addEventListener('click', unlockAudio);
      window.addEventListener('touchstart', unlockAudio);

      // 自動依今日真實星期設定預設值（週末預設為週一）
      const today = new Date().getDay();
      if (today >= 1 && today <= 5) {
        currentWeekday = today;
      } else {
        currentWeekday = 1;
      }

      switchWeekday(currentWeekday);
      renderDutyBoard();
      updateRhythm();
      setInterval(updateRhythm, 1000);
    });
  </script>
</body>
</html>
