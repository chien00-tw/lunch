<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>午間節奏引導系統 v1.8.0</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Noto+Sans+TC:wght@500;700;900&display=swap');

    body {
      font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    
    .font-digital {
      font-family: 'Chakra Petch', 'Noto Sans TC', monospace;
    }

    /* 超大字體適應教室遠距離視線與大螢幕黑板 */
    .huge-time {
      font-size: clamp(5rem, 18vw, 15rem);
      line-height: 0.92;
    }

    /* 隱藏原生滾動條但保留滑動 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 針對觸控螢幕優化點擊反饋 */
    .touch-btn {
      min-width: 3rem;
      min-height: 3rem;
      touch-action: manipulation;
    }
    .touch-btn:active {
      transform: scale(0.94);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-700 ease-in-out">

  <!-- 頂部導航與超大圖示觸控按鈕列 (附帶 Hover Tooltip) -->
  <header class="w-full px-4 md:px-8 py-3.5 flex flex-wrap justify-between items-center gap-3 border-b border-slate-800 bg-slate-950/90 backdrop-blur-md z-20">
    <div class="flex items-center gap-3.5">
      <div class="w-4 h-4 md:w-5 md:h-5 rounded-full bg-emerald-500 animate-pulse shadow-lg shadow-emerald-500/50"></div>
      <h1 class="text-xl md:text-3xl lg:text-4xl font-black tracking-wider text-slate-100 flex items-center gap-2.5">
        午間節奏引導系統
        <span class="text-xs md:text-sm px-3 py-1 rounded-full bg-slate-800 text-emerald-400 font-mono border border-emerald-500/30">v1.8.0</span>
      </h1>
    </div>

    <!-- 超大純圖示觸控按鈕群組 -->
    <div class="flex items-center gap-3 md:gap-4">
      <!-- 輪值名單按鈕 -->
      <div class="relative group">
        <button onclick="toggleDutyModal(true)" aria-label="午餐輪值名單" class="touch-btn w-12 h-12 md:w-14 md:h-14 lg:w-16 lg:h-16 flex items-center justify-center rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-100 border-2 border-slate-600 text-2xl md:text-3xl shadow-xl transition active:scale-95">
          📋
        </button>
        <div class="absolute -bottom-11 left-1/2 -translate-x-1/2 px-3 py-1.5 bg-slate-800 text-slate-200 text-xs md:text-sm font-bold rounded-xl opacity-0 pointer-events-none group-hover:opacity-100 transition duration-200 whitespace-nowrap border border-slate-700 shadow-2xl z-30">
          午餐輪值名單
        </div>
      </div>

      <!-- 行程編修按鈕 -->
      <div class="relative group">
        <button onclick="toggleScheduleModal(true)" aria-label="行程時間與內容編修" class="touch-btn w-12 h-12 md:w-14 md:h-14 lg:w-16 lg:h-16 flex items-center justify-center rounded-2xl bg-indigo-900/70 hover:bg-indigo-800 text-indigo-200 border-2 border-indigo-500/50 text-2xl md:text-3xl shadow-xl transition active:scale-95">
          ⚙️
        </button>
        <div class="absolute -bottom-11 left-1/2 -translate-x-1/2 px-3 py-1.5 bg-slate-800 text-indigo-300 text-xs md:text-sm font-bold rounded-xl opacity-0 pointer-events-none group-hover:opacity-100 transition duration-200 whitespace-nowrap border border-slate-700 shadow-2xl z-30">
          行程時間與內容編修
        </div>
      </div>

      <!-- 提醒音效切換 -->
      <div class="relative group">
        <button onclick="toggleSound()" id="soundBtn" aria-label="切換音效" class="touch-btn w-12 h-12 md:w-14 md:h-14 lg:w-16 lg:h-16 flex items-center justify-center rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 border-2 border-slate-600 text-2xl md:text-3xl shadow-xl transition active:scale-95">
          <span id="soundIcon">🔔</span>
        </button>
        <div class="absolute -bottom-11 left-1/2 -translate-x-1/2 px-3 py-1.5 bg-slate-800 text-slate-200 text-xs md:text-sm font-bold rounded-xl opacity-0 pointer-events-none group-hover:opacity-100 transition duration-200 whitespace-nowrap border border-slate-700 shadow-2xl z-30">
          切換提醒音效
        </div>
      </div>

      <!-- 全螢幕按鈕 -->
      <div class="relative group">
        <button onclick="toggleFullScreen()" aria-label="全螢幕切換" class="touch-btn w-12 h-12 md:w-14 md:h-14 lg:w-16 lg:h-16 flex items-center justify-center rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white text-2xl md:text-3xl shadow-xl shadow-emerald-950/50 transition active:scale-95 border-2 border-emerald-400">
          <span id="fsIcon">⛶</span>
        </button>
        <div class="absolute -bottom-11 left-1/2 -translate-x-1/2 px-3 py-1.5 bg-slate-800 text-emerald-300 text-xs md:text-sm font-bold rounded-xl opacity-0 pointer-events-none group-hover:opacity-100 transition duration-200 whitespace-nowrap border border-slate-700 shadow-2xl z-30">
          全螢幕切換
        </div>
      </div>
    </div>
  </header>

  <!-- 週一至週五切換橫條 (靠左排列，加大按鈕觸控區域) -->
  <div class="w-full bg-slate-950/90 border-b border-slate-800/80 px-4 md:px-8 py-2.5 flex items-center justify-start flex-wrap gap-2.5 md:gap-3.5 z-10">
    <div class="flex items-center gap-2 md:gap-3 flex-wrap">
      <span class="text-slate-400 font-black text-sm md:text-base mr-1">📅 星期切換：</span>
      <button onclick="switchWeekday(1)" id="btnDay-1" class="weekday-btn touch-btn px-4 md:px-6 py-2 rounded-2xl font-black text-sm md:text-base transition-all border">週一</button>
      <button onclick="switchWeekday(2)" id="btnDay-2" class="weekday-btn touch-btn px-4 md:px-6 py-2 rounded-2xl font-black text-sm md:text-base transition-all border">週二 (含氟漱口水)</button>
      <button onclick="switchWeekday(3)" id="btnDay-3" class="weekday-btn touch-btn px-4 md:px-6 py-2 rounded-2xl font-black text-sm md:text-base transition-all border">週三 (12:40放學)</button>
      <button onclick="switchWeekday(4)" id="btnDay-4" class="weekday-btn touch-btn px-4 md:px-6 py-2 rounded-2xl font-black text-sm md:text-base transition-all border">週四</button>
      <button onclick="switchWeekday(5)" id="btnDay-5" class="weekday-btn touch-btn px-4 md:px-6 py-2 rounded-2xl font-black text-sm md:text-base transition-all border">週五</button>
    </div>
  </div>

  <!-- 主畫面儀表板 -->
  <main class="flex-1 flex flex-col justify-center items-center px-4 md:px-12 py-3 md:py-6 relative">

    <!-- 背景柔和光暈 -->
    <div id="ambientGlow" class="absolute w-[650px] h-[650px] rounded-full bg-emerald-500/10 blur-[150px] pointer-events-none -z-10 transition-all duration-1000"></div>

    <!-- 階段狀態膠囊標籤 (超大字體與圖示) -->
    <div id="phaseBadgeContainer" class="mb-2 md:mb-3">
      <div id="phaseTag" class="px-8 md:px-14 py-3 md:py-4 rounded-full text-2xl md:text-4xl font-black tracking-wider uppercase shadow-2xl transition-all duration-500 flex items-center gap-3.5 bg-emerald-600 text-white border-2 border-emerald-400">
        <span id="phaseIcon" class="text-3xl md:text-5xl">🍲</span>
        <span id="phaseTitle">盛飯打菜時間</span>
      </div>
    </div>

    <!-- 超大核心時間顯示 (不顯示秒數) -->
    <div class="flex flex-col items-center my-1 md:my-2">
      <div id="clockDisplay" class="huge-time font-digital font-bold tracking-tight text-white drop-shadow-[0_14px_28px_rgba(0,0,0,0.85)] text-center">
        12:00
      </div>
      <!-- 極簡精準說明文字 -->
      <div id="phaseSubtext" class="text-xl md:text-3xl lg:text-4xl font-black text-slate-200 tracking-wide mt-1 text-center">
        搬餐桶、準備餐具、盛裝飯菜
      </div>
    </div>

    <!-- 進度與剩餘時間卡片 -->
    <div class="w-full max-w-5xl mt-3 md:mt-6 bg-slate-950/75 p-5 md:p-7 rounded-3xl border-2 border-slate-800/80 shadow-2xl backdrop-blur-md">
      <div class="flex flex-wrap justify-between items-center mb-3 gap-2 text-lg md:text-2xl font-bold">
        <span id="countdownLabel" class="text-slate-400 flex items-center gap-2">
          <span>⏳ 距離本階段結束：</span>
          <span id="countdownText" class="text-emerald-400 font-digital text-3xl md:text-4xl font-black">15 分鐘</span>
        </span>
        <span id="nextPhasePreview" class="text-slate-400 text-right">
          下一階段：<span class="text-slate-100 font-bold" id="nextPhaseName">安靜用餐</span>
        </span>
      </div>
      <!-- 超大圓角進度條 -->
      <div class="w-full h-6 md:h-8 bg-slate-800 rounded-full overflow-hidden p-1 border-2 border-slate-700">
        <div id="progressBar" class="h-full bg-gradient-to-r from-emerald-500 to-teal-400 rounded-full transition-all duration-500 ease-out" style="width: 0%;"></div>
      </div>
    </div>

    <!-- 關鍵提醒廣播橫幅 -->
    <div id="broadcastCard" class="w-full max-w-5xl mt-4 hidden transform transition-all duration-500">
      <div id="broadcastInner" class="rounded-3xl p-5 md:p-6 flex flex-col sm:flex-row items-center justify-between border-2 shadow-2xl gap-4">
        <div class="flex items-center gap-4 text-left">
          <span id="broadcastIcon" class="text-4xl md:text-5xl flex-shrink-0">⏰</span>
          <div>
            <div id="broadcastTitle" class="text-xl md:text-3xl font-black">提醒訊息</div>
            <div id="broadcastDetail" class="text-base md:text-xl font-bold opacity-90 mt-1">詳細說明內容</div>
          </div>
        </div>
        <button onclick="dismissBroadcast()" class="touch-btn px-6 py-3 bg-black/40 hover:bg-black/60 rounded-2xl text-base md:text-lg font-black border border-white/30 transition flex-shrink-0">
          我知道了
        </button>
      </div>
    </div>

  </main>

  <!-- 中間底部階段時間軸 (動態自適應響應式排列) -->
  <section class="w-full bg-slate-950/90 border-t border-slate-800/80 px-4 md:px-8 py-3.5">
    <div id="timelineContainer" class="max-w-6xl mx-auto grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2.5 md:gap-3.5 text-xs md:text-sm">
      <!-- 由 JavaScript 動態生成節奏卡片 -->
    </div>
  </section>

  <!-- 頁尾：指定署名 -->
  <footer class="w-full bg-slate-950 py-3 text-center text-slate-400 text-sm md:text-base font-bold border-t border-slate-900">
    班級百寶箱 | Design：S.C. Kuo
  </footer>

  <!-- 行程線上編修彈窗 Modal -->
  <div id="scheduleModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden" onclick="handleBackdropClick(event, 'scheduleModal')">
    <div class="bg-slate-900 border-2 border-slate-700 w-full max-w-3xl rounded-3xl p-6 md:p-8 shadow-2xl overflow-hidden flex flex-col max-h-[90vh]" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center pb-4 border-b border-slate-800">
        <div>
          <h2 class="text-2xl md:text-3xl font-black text-white flex items-center gap-2">
            <span>⚙️</span> 行程時間與內容編修
          </h2>
          <p class="text-sm text-indigo-300 mt-1">目前編輯：<span id="editDayLabel" class="font-bold text-amber-300 text-base">週一</span> 的專屬排程</p>
        </div>
        <button onclick="toggleScheduleModal(false)" class="touch-btn w-11 h-11 flex items-center justify-center rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white text-2xl font-bold">✕</button>
      </div>

      <!-- 動態排程階段清單 -->
      <div class="my-4 overflow-y-auto space-y-3.5 no-scrollbar pr-1 flex-1" id="scheduleItemsContainer">
        <!-- JS 動態生成 -->
      </div>

      <div class="pt-4 flex flex-wrap justify-between items-center border-t border-slate-800 gap-3">
        <div class="flex gap-2.5">
          <button onclick="addSchedulePhase()" class="touch-btn px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-indigo-300 font-black rounded-xl border border-indigo-500/40 text-sm md:text-base transition">
            + 新增階段
          </button>
          <button onclick="resetCurrentDayDefault()" class="touch-btn px-4 py-2.5 bg-slate-800 hover:bg-rose-900/60 text-slate-400 hover:text-rose-200 font-black rounded-xl border border-slate-700 text-sm md:text-base transition">
            恢復本週預設
          </button>
        </div>
        <button onclick="saveScheduleList()" class="touch-btn px-7 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl shadow-lg text-base md:text-lg transition">
          儲存並即時更新
        </button>
      </div>
    </div>
  </div>

  <!-- 午餐輪值名單設定彈窗 Modal -->
  <div id="dutyModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden" onclick="handleBackdropClick(event, 'dutyModal')">
    <div class="bg-slate-900 border-2 border-slate-700 w-full max-w-2xl rounded-3xl p-6 md:p-8 shadow-2xl overflow-hidden flex flex-col max-h-[90vh]" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center pb-4 border-b border-slate-800">
        <h2 class="text-2xl md:text-3xl font-black text-white flex items-center gap-2">
          <span>📋</span> 午餐輪值名單與工作自訂
        </h2>
        <button onclick="toggleDutyModal(false)" class="touch-btn w-11 h-11 flex items-center justify-center rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white text-2xl font-bold">✕</button>
      </div>

      <!-- 動態工作列表區塊 -->
      <div class="my-4 overflow-y-auto space-y-3.5 no-scrollbar pr-1 flex-1" id="dutyItemsContainer">
        <!-- JS 動態渲染 -->
      </div>

      <div class="pt-4 flex flex-wrap justify-between items-center border-t border-slate-800 gap-3">
        <button onclick="addDutyItem()" class="touch-btn px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-emerald-400 font-black rounded-xl border border-emerald-500/40 text-sm md:text-base transition">
          + 新增工作項目
        </button>
        <button onclick="saveDutyList()" class="touch-btn px-7 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl shadow-lg text-base md:text-lg transition">
          儲存並更新名單
        </button>
      </div>
    </div>
  </div>

          colorClass: "bg-amber-600 text-white border-amber-400",
          barColor: "from-amber-500 to-yellow-400",
          glowColor: "rgba(245, 158, 11, 0.25)",
          darken: false
        },
        {
          startStr: "12:40", endStr: "12:50",
          title: "放學時間", icon: "🎒",
          subtext: "12:40 放學，互相道別，安全回家",
          colorClass: "bg-orange-600 text-white border-orange-400",
          barColor: "from-orange-500 to-amber-400",
          glowColor: "rgba(234, 88, 12, 0.25)",
          darken: false
        }
      ]
    };

    // 執行中的週一至週五排程資料庫
    let activeSchedules = {
      1: JSON.parse(JSON.stringify(DEFAULT_SCHEDULES.standard)),
      2: JSON.parse(JSON.stringify(DEFAULT_SCHEDULES.tuesday)),
      3: JSON.parse(JSON.stringify(DEFAULT_SCHEDULES.wednesday)),
      4: JSON.parse(JSON.stringify(DEFAULT_SCHEDULES.standard)),
      5: JSON.parse(JSON.stringify(DEFAULT_SCHEDULES.standard))
    };

    // 輪值工作清單
    let dutyData = [
      { id: 1, title: "餐桶搬運", members: "01 號、02 號" },
      { id: 2, title: "主食打菜（飯 / 麵）", members: "03 號、04 號" },
      { id: 3, title: "主菜與副菜分配", members: "05 號、06 號" },
      { id: 4, title: "湯品與水果分配", members: "07 號" },
      { id: 5, title: "桌面擦拭與清潔", members: "08 號、09 號" }
    ];

    function parseTimeToMinutes(timeStr) {
      if (!timeStr) return 0;
      const parts = timeStr.split(':').map(Number);
      return (parts[0] || 0) * 60 + (parts[1] || 0);
    }

    // 初始化與喚醒 AudioContext（避免行動裝置自動靜音阻擋）
    function initAudioContext() {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn("AudioContext 喚醒失敗", e);
      }
    }

    function playChime(type = 'normal') {
      if (!soundEnabled) return;
      try {
        initAudioContext();
        if (!audioCtx) return;
        
        const now = audioCtx.currentTime;
        const notes = type === 'alert' ? [523.25, 659.25, 783.99, 1046.50] : [440, 554.37, 659.25];
        
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          
          gain.gain.setValueAtTime(0.001, now + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.2, now + idx * 0.12 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.12 + 0.9);
          
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 1.0);
        });
      } catch (e) {
        console.warn("音效播放受限", e);
      }
    }

    function updateRhythm() {
      const now = new Date();
      const currentHour = now.getHours();
      const currentMinute = now.getMinutes();
      const currentTotalMinutes = currentHour * 60 + currentMinute;

      const formattedHour = String(currentHour).padStart(2, '0');
      const formattedMinute = String(currentMinute).padStart(2, '0');
      const timeKey = `${formattedHour}:${formattedMinute}`;

      // 更新超大時間顯示（不顯示秒）
      const clockEl = document.getElementById('clockDisplay');
      if (clockEl) clockEl.textContent = timeKey;

      const daySchedule = activeSchedules[currentWeekday] || activeSchedules[1];
      let currentPhase = null;
      let currentIndex = -1;

      for (let i = 0; i < daySchedule.length; i++) {
        const sMin = parseTimeToMinutes(daySchedule[i].startStr);
        const eMin = parseTimeToMinutes(daySchedule[i].endStr);
        if (currentTotalMinutes >= sMin && currentTotalMinutes < eMin) {
          currentPhase = daySchedule[i];
          currentIndex = i;
          break;
        }
      }

      const firstStartMin = parseTimeToMinutes(daySchedule[0].startStr);

      if (!currentPhase) {
        if (currentTotalMinutes < firstStartMin) {
          renderOffSchedule("準備午餐時間", `距離 ${daySchedule[0].startStr} 開始還有 ${firstStartMin - currentTotalMinutes} 分鐘`, daySchedule[0].title, 0);
        } else {
          const finishText = currentWeekday === 3 ? "放學時間已到，平安回家！" : "午休結束，精神飽滿迎接下午課程";
          renderOffSchedule(currentWeekday === 3 ? "放學時間" : "午休結束", finishText, currentWeekday === 3 ? "放學" : "下午課程", 100);
        }
        updateTimelineVisuals(-1);
        handleAlerts(timeKey);
        return;
      }

      // 更新階段標籤與文字
      const phaseTag = document.getElementById('phaseTag');
      if (phaseTag) {
        phaseTag.className = `px-8 md:px-14 py-3 md:py-4 rounded-full text-2xl md:text-4xl font-black tracking-wider uppercase shadow-2xl transition-all duration-500 flex items-center gap-3.5 border-2 ${currentPhase.colorClass}`;
      }
      document.getElementById('phaseIcon').textContent = currentPhase.icon;
      document.getElementById('phaseTitle').textContent = currentPhase.title;
      document.getElementById('phaseSubtext').textContent = currentPhase.subtext;

      // 倒數與進度條
      const sMin = parseTimeToMinutes(currentPhase.startStr);
      const eMin = parseTimeToMinutes(currentPhase.endStr);
      const minutesLeft = Math.max(0, eMin - currentTotalMinutes);
      const totalDuration = Math.max(1, eMin - sMin);
      const elapsed = Math.max(0, currentTotalMinutes - sMin);
      const progressPercent = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));

      document.getElementById('countdownText').textContent = `${minutesLeft} 分鐘`;
      const pBar = document.getElementById('progressBar');
      if (pBar) {
        pBar.style.width = `${progressPercent}%`;
        pBar.className = `h-full bg-gradient-to-r ${currentPhase.barColor} rounded-full transition-all duration-500 ease-out`;
      }

      // 下一階段提示
      if (currentIndex < daySchedule.length - 1) {
        document.getElementById('nextPhaseName').textContent = daySchedule[currentIndex + 1].title;
      } else {
        document.getElementById('nextPhaseName').textContent = currentWeekday === 3 ? "平安放學" : "下午課堂時段";
      }

      // 背景光暈與深色模式
      const glowEl = document.getElementById('ambientGlow');
      if (glowEl) glowEl.style.backgroundColor = currentPhase.glowColor;

      if (currentPhase.darken) {
        document.body.classList.add('bg-slate-950');
        document.body.classList.remove('bg-slate-900');
      } else {
        document.body.classList.remove('bg-slate-950');
        document.body.classList.add('bg-slate-900');
      }

      updateTimelineVisuals(currentIndex);
      handleAlerts(timeKey);
    }

    function renderOffSchedule(title, subtext, nextTitle, progress) {
      const phaseTag = document.getElementById('phaseTag');
      if (phaseTag) {
        phaseTag.className = "px-8 md:px-14 py-3 md:py-4 rounded-full text-2xl md:text-4xl font-black tracking-wider uppercase shadow-2xl transition-all duration-500 flex items-center gap-3.5 bg-slate-800 text-slate-300 border-2 border-slate-700";
      }
      document.getElementById('phaseIcon').textContent = "⏰";
      document.getElementById('phaseTitle').textContent = title;
      document.getElementById('phaseSubtext').textContent = subtext;
      document.getElementById('countdownText').textContent = "-- 分鐘";
      document.getElementById('nextPhaseName').textContent = nextTitle;
      const pBar = document.getElementById('progressBar');
      if (pBar) pBar.style.width = `${progress}%`;
      document.body.classList.remove('bg-slate-950');
      document.body.classList.add('bg-slate-900');
    }

    function renderTimelineCards() {
      const container = document.getElementById('timelineContainer');
      if (!container) return;
      container.innerHTML = '';
      const daySchedule = activeSchedules[currentWeekday] || activeSchedules[1];

      // 自適應 Grid 欄數
      if (daySchedule.length <= 4) {
        container.className = "max-w-6xl mx-auto grid grid-cols-2 sm:grid-cols-4 gap-2.5 md:gap-3.5 text-xs md:text-sm";
      } else {
        container.className = "max-w-6xl mx-auto grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2.5 md:gap-3.5 text-xs md:text-sm";
      }

      daySchedule.forEach((step, idx) => {
        const card = document.createElement('div');
        card.id = `timeline-step-${idx}`;
        card.className = "timeline-card p-3.5 rounded-2xl border border-slate-800 bg-slate-900/60 flex flex-col justify-between transition-all";
        card.innerHTML = `
          <div class="font-digital text-emerald-400 font-bold text-sm md:text-base">${step.startStr} - ${step.endStr}</div>
          <div class="font-black text-slate-100 text-base md:text-lg mt-0.5">${step.title}</div>
          <div class="text-slate-400 text-xs md:text-sm line-clamp-1">${step.subtext}</div>
        `;
        container.appendChild(card);
      });
    }

    function updateTimelineVisuals(activeIdx) {
      const daySchedule = activeSchedules[currentWeekday] || activeSchedules[1];
      daySchedule.forEach((_, idx) => {
        const card = document.getElementById(`timeline-step-${idx}`);
        if (!card) return;
        if (idx === activeIdx) {
          card.className = "timeline-card p-3.5 rounded-2xl border-2 border-emerald-400 bg-emerald-950/80 shadow-xl shadow-emerald-950 flex flex-col justify-between transition-all scale-[1.03]";
        } else if (idx < activeIdx) {
          card.className = "timeline-card p-3.5 rounded-2xl border border-slate-800/80 bg-slate-950/40 opacity-40 flex flex-col justify-between transition-all";
        } else {
          card.className = "timeline-card p-3.5 rounded-2xl border border-slate-800 bg-slate-900/60 opacity-80 flex flex-col justify-between transition-all";
        }
      });
    }

    function handleAlerts(timeKey) {
      let alertInfo = null;

      if (timeKey === "12:27") {
        const isTue = currentWeekday === 2;
        alertInfo = {
          title: isTue ? "🪥 12:27 準備收拾、潔牙與含氟漱口水（即將進入環境整理）" : "🪥 12:27 準備收拾與潔牙（即將進入 12:30 環境整理）",
          detail: isTue ? "用餐時間剩餘 3 分鐘，請儘速收拾餐具並潔牙，完成後使用含氟漱口水。" : "用餐時間剩餘 3 分鐘，請準備收拾餐具並進行潔牙漱口。",
          bg: "bg-amber-900/95 text-amber-100 border-amber-400",
          icon: "⏰"
        };
      } else if (timeKey === "12:37") {
        if (currentWeekday === 3) {
          alertInfo = {
            title: "🎒 12:37 準備放學（即將於 12:40 放學）",
            detail: "請加快環境整理動作，收拾書包與個人物品，準備 12:40 安全回家。",
            bg: "bg-amber-900/95 text-amber-100 border-amber-400",
            icon: "🎒"
          };
        } else {
          alertInfo = {
            title: "🚽 12:37 加快動作，準備進入 12:40 預備午休",
            detail: "環境整理即將截止！請儘速完成如廁、洗手、裝水與訂正作業，桌面清空準備午休。",
            bg: "bg-indigo-900/95 text-indigo-100 border-indigo-400",
            icon: "🚶"
          };
        }
      } else if (timeKey === "12:47" && currentWeekday !== 3) {
        alertInfo = {
          title: "💤 12:47 桌面清空，準備進入 12:50 熄燈休息",
          detail: "預備時間剩餘 3 分鐘！請回座就位、桌面完全淨空，值日生準備拉窗簾與熄燈。",
          bg: "bg-purple-950/95 text-purple-200 border-purple-400",
          icon: "🌙"
        };
      }

      if (alertInfo && lastAlertKey !== timeKey) {
        const card = document.getElementById('broadcastCard');
        const inner = document.getElementById('broadcastInner');

        inner.className = `rounded-3xl p-5 md:p-6 flex flex-col sm:flex-row items-center justify-between border-2 shadow-2xl gap-4 ${alertInfo.bg}`;
        document.getElementById('broadcastIcon').textContent = alertInfo.icon;
        document.getElementById('broadcastTitle').textContent = alertInfo.title;
        document.getElementById('broadcastDetail').textContent = alertInfo.detail;

        card.classList.remove('hidden');
        playChime('alert');
        lastAlertKey = timeKey;
      }
    }

    function dismissBroadcast() {
      document.getElementById('broadcastCard').classList.add('hidden');
    }

    function switchWeekday(dayNum) {
      initAudioContext();
      currentWeekday = dayNum;
      lastAlertKey = null;

      // 更新按鈕樣式
      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById(`btnDay-${i}`);
        if (!btn) continue;
        if (i === dayNum) {
          btn.className = "weekday-btn touch-btn px-4 md:px-6 py-2 rounded-2xl font-black text-sm md:text-base transition-all border-2 bg-emerald-600 text-white border-emerald-400 shadow-xl scale-105";
        } else {
          btn.className = "weekday-btn touch-btn px-4 md:px-6 py-2 rounded-2xl font-black text-sm md:text-base transition-all border border-slate-700 bg-slate-900/80 text-slate-300 hover:bg-slate-800";
        }
      }

      renderTimelineCards();
      updateRhythm();
    }

    function toggleSound() {
      initAudioContext();
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('soundIcon');
      const btn = document.getElementById('soundBtn');
      if (soundEnabled) {
        icon.textContent = "🔔";
        btn.classList.replace('text-slate-500', 'text-slate-200');
        playChime('normal');
      } else {
        icon.textContent = "🔕";
        btn.classList.replace('text-slate-200', 'text-slate-500');
      }
    }

    function toggleFullScreen() {
      initAudioContext();
      const fsIcon = document.getElementById('fsIcon');
      const doc = document.documentElement;

      if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
        if (doc.requestFullscreen) {
          doc.requestFullscreen().catch(err => console.warn(err));
        } else if (doc.webkitRequestFullscreen) {
          doc.webkitRequestFullscreen();
        } else if (doc.mozRequestFullScreen) {
          doc.mozRequestFullScreen();
        } else if (doc.msRequestFullscreen) {
          doc.msRequestFullscreen();
        }
        if (fsIcon) fsIcon.textContent = "🗗";
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(err => console.warn(err));
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.mozCancelFullScreen) {
          document.mozCancelFullScreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
        if (fsIcon) fsIcon.textContent = "⛶";
      }
    }

    function handleBackdropClick(event, modalId) {
      if (event.target.id === modalId) {
        document.getElementById(modalId).classList.add('hidden');
      }
    }

    function toggleScheduleModal(show) {
      initAudioContext();
      const modal = document.getElementById('scheduleModal');
      if (show) {
        const dayNames = { 1: "週一", 2: "週二", 3: "週三", 4: "週四", 5: "週五" };
        document.getElementById('editDayLabel').textContent = dayNames[currentWeekday];
        renderScheduleEditorInputs();
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function renderScheduleEditorInputs() {
      const container = document.getElementById('scheduleItemsContainer');
      container.innerHTML = '';
      const daySchedule = activeSchedules[currentWeekday] || activeSchedules[1];

      daySchedule.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = "bg-slate-800/90 p-4 rounded-2xl border border-slate-700 flex flex-col gap-3";
        row.innerHTML = `
          <div class="flex flex-wrap items-center gap-2.5">
            <span class="text-xs md:text-sm font-bold text-slate-400">階段 ${index + 1}</span>
            <input type="text" value="${item.icon}" oninput="activeSchedules[currentWeekday][${index}].icon = this.value" class="w-14 text-center bg-slate-900 border border-slate-700 rounded-xl py-2 text-white font-bold text-lg" title="圖示 Emoji">
            <input type="text" value="${item.title}" oninput="activeSchedules[currentWeekday][${index}].title = this.value" class="flex-1 min-w-[140px] bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-sm md:text-base" placeholder="階段名稱">
            <div class="flex items-center gap-1.5">
              <input type="time" value="${item.startStr}" oninput="activeSchedules[currentWeekday][${index}].startStr = this.value" class="bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-white font-digital text-sm">
              <span class="text-slate-500 font-bold">~</span>
              <input type="time" value="${item.endStr}" oninput="activeSchedules[currentWeekday][${index}].endStr = this.value" class="bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-white font-digital text-sm">
            </div>
            <button onclick="removeSchedulePhase(${index})" class="touch-btn text-rose-400 hover:text-rose-300 font-black px-3 py-2 rounded-xl bg-rose-950/50 border border-rose-800/60 text-sm" title="刪除此階段">✕</button>
          </div>
          <div>
            <input type="text" value="${item.subtext}" oninput="activeSchedules[currentWeekday][${index}].subtext = this.value" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-slate-200 text-sm md:text-base" placeholder="說明文字">
          </div>
        `;
        container.appendChild(row);
      });
    }

    function addSchedulePhase() {
      const daySchedule = activeSchedules[currentWeekday];
      const lastPhase = daySchedule[daySchedule.length - 1];
      const newStart = lastPhase ? lastPhase.endStr : "12:00";
      daySchedule.push({
        startStr: newStart,
        endStr: "13:00",
        title: "自訂階段",
        icon: "📌",
        subtext: "請自訂任務與說明",
        colorClass: "bg-slate-700 text-white border-slate-500",
        barColor: "from-slate-600 to-slate-400",
        glowColor: "rgba(100, 116, 139, 0.2)",
        darken: false
      });
      renderScheduleEditorInputs();
    }

    function removeSchedulePhase(index) {
      if (activeSchedules[currentWeekday].length <= 1) return;
      activeSchedules[currentWeekday].splice(index, 1);
      renderScheduleEditorInputs();
    }

    function resetCurrentDayDefault() {
      if (currentWeekday === 2) {
        activeSchedules[2] = JSON.parse(JSON.stringify(DEFAULT_SCHEDULES.tuesday));
      } else if (currentWeekday === 3) {
        activeSchedules[3] = JSON.parse(JSON.stringify(DEFAULT_SCHEDULES.wednesday));
      } else {
        activeSchedules[currentWeekday] = JSON.parse(JSON.stringify(DEFAULT_SCHEDULES.standard));
      }
      renderScheduleEditorInputs();
      renderTimelineCards();
      updateRhythm();
    }

    function saveScheduleList() {
      toggleScheduleModal(false);
      renderTimelineCards();
      updateRhythm();
    }

    function renderDutyListInputs() {
      const container = document.getElementById('dutyItemsContainer');
      container.innerHTML = '';

      dutyData.forEach((item, index) => {
        const itemRow = document.createElement('div');
        itemRow.className = "bg-slate-800/90 p-4 rounded-2xl border border-slate-700 flex flex-col sm:flex-row gap-3 items-center";
        itemRow.innerHTML = `
          <div class="w-full sm:w-5/12">
            <label class="block text-xs font-bold text-emerald-400 mb-1">工作內容</label>
            <input type="text" value="${item.title}" oninput="dutyData[${index}].title = this.value" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white font-bold text-base focus:outline-none focus:border-emerald-500" placeholder="工作名稱">
          </div>
          <div class="w-full sm:w-6/12">
            <label class="block text-xs font-bold text-cyan-400 mb-1">負責座號 / 姓名</label>
            <input type="text" value="${item.members}" oninput="dutyData[${index}].members = this.value" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white font-bold text-base focus:outline-none focus:border-cyan-500" placeholder="座號或姓名">
          </div>
          <div class="w-full sm:w-1/12 flex justify-end sm:justify-center pt-1 sm:pt-4">
            <button onclick="removeDutyItem(${index})" class="touch-btn w-10 h-10 flex items-center justify-center rounded-xl bg-rose-950/40 border border-rose-800/50 text-rose-400 hover:text-rose-300 font-black text-xl" title="刪除此項目">✕</button>
          </div>
        `;
        container.appendChild(itemRow);
      });
    }

    function addDutyItem() {
      dutyData.push({ id: Date.now(), title: "新工作項目", members: "" });
      renderDutyListInputs();
    }

    function removeDutyItem(index) {
      dutyData.splice(index, 1);
      renderDutyListInputs();
    }

    function toggleDutyModal(show) {
      initAudioContext();
      const modal = document.getElementById('dutyModal');
      if (show) {
        renderDutyListInputs();
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function saveDutyList() {
      toggleDutyModal(false);
    }

    // 全域鍵盤事件監聽（ESC 鍵關閉彈窗）
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        toggleScheduleModal(false);
        toggleDutyModal(false);
        dismissBroadcast();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      // 一次性使用者互動喚醒 AudioContext
      const unlockAudio = () => {
        initAudioContext();
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
      };
      window.addEventListener('click', unlockAudio);
      window.addEventListener('touchstart', unlockAudio);

      // 自動判定今日星期 (1~5，週末預設週一)
      const now = new Date();
      let day = now.getDay();
      if (day >= 1 && day <= 5) {
        currentWeekday = day;
      } else {
        currentWeekday = 1;
      }

      switchWeekday(currentWeekday);
      setInterval(updateRhythm, 1000);
    });
  </script>
</body>
</html>
